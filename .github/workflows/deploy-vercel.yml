name: Deploy frontend to Vercel

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-vercel.yml"
      - "frontend/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

concurrency:
  group: vercel-${{ github.event_name == 'push' && 'production' || inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'push' && 'production' || inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || inputs.environment }}
    env:
      DEPLOY_ENV: ${{ github.event_name == 'push' && 'production' || inputs.environment }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Test backend
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Check Flutter
        working-directory: frontend
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test

      - name: Build Flutter web
        working-directory: frontend
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "${API_BASE_URL}" ]; then
            echo "Missing GitHub Environment variable: API_BASE_URL"
            exit 1
          fi
          flutter build web --release \
            --dart-define=API_BASE_URL="${API_BASE_URL}"

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@56.5.0

      - name: Pull Vercel project settings
        working-directory: frontend
        run: |
          vercel pull --yes \
            --environment="${DEPLOY_ENV}" \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Vercel artifact
        working-directory: frontend
        run: |
          PROD_FLAG=""
          if [ "${DEPLOY_ENV}" = "production" ]; then
            PROD_FLAG="--prod"
          fi
          vercel build ${PROD_FLAG} \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt artifact
        working-directory: frontend
        run: |
          PROD_FLAG=""
          if [ "${DEPLOY_ENV}" = "production" ]; then
            PROD_FLAG="--prod"
          fi
          vercel deploy --prebuilt ${PROD_FLAG} \
            --token="${{ secrets.VERCEL_TOKEN }}"
